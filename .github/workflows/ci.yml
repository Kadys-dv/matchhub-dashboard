name: Qualidade
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Publicar cobertura Vitest
        uses: actions/upload-artifact@v5
        with:
          name: matchhub-dashboard-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14
